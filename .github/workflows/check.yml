name: FS-1 plate watcher

on:
  schedule:
    # GitHub cron is in UTC. ':07' avoids the top-of-hour stampede. Hourly.
    - cron: "7 * * * *"
  workflow_dispatch:      # lets you trigger a run manually from the Actions tab
    inputs:
      report:
        description: "Send a full status report (not just changes)"
        type: boolean
        default: false

# Never run two sweeps at once (a sweep is 7 requests, well under a minute).
concurrency:
  group: plate-watcher
  cancel-in-progress: false

# Needed so the job can commit the updated state.json back to the repo.
permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run the watcher
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
        run: python monitor.py ${{ github.event.inputs.report == 'true' && '--report' || '' }}

      - name: Persist state (also acts as an hourly heartbeat)
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain state.json)" ]]; then
            git config user.name  "plate-watcher"
            git config user.email "actions@users.noreply.github.com"
            git add state.json
            git commit -m "state update [skip ci]"
            git push
          else
            echo "state.json unchanged"
          fi
